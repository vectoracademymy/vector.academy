    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('examBody');
            if (container) {
                // KaTeXレンダリング
                const formulas = container.querySelectorAll('.ql-formula');
                formulas.forEach(formulaEl => {
                    const tex = formulaEl.getAttribute('data-value');
                    if (tex) {
                        try {
                            const isBlock = formulaEl.parentElement.tagName === 'P' && 
                                            formulaEl.parentElement.textContent.trim() === formulaEl.textContent.trim();
                            katex.render(tex, formulaEl, {
                                throwOnError: false,
                                displayMode: isBlock
                            });
                        } catch (err) {
                            console.error('KaTeX error:', err);
                        }
                    }
                });

                if (typeof renderMathInElement === 'function') {
                    renderMathInElement(container, {
                        delimiters: [
                            {left: '$$', right: '$$', display: true},
                            {left: '$', right: '$', display: false},
                            {left: '\\(', right: '\\)', display: false},
                            {left: '\\[', right: '\\]', display: true}
                        ],
                        throwOnError: false
                    });
                }
            }
        });
    </script>
